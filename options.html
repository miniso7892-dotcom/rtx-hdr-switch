<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="options.title">RTX HDR 开关备份</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 128 128" aria-hidden="true">
        <rect x="0" y="0" width="128" height="128" rx="14" class="logo-bg"></rect>
        <rect x="21" y="33" width="86" height="62" class="logo-screen"></rect>
        <rect x="16" y="28" width="48" height="72" class="logo-lit"></rect>
        <rect x="58" y="14" width="13" height="100" class="logo-bar"></rect>
      </svg>
      <h1 data-i18n="app.name">RTX HDR 开关</h1>
    </div>
  </header>

  <main class="wrap">
    <p class="lead" data-i18n="options.back">设置都在扩展弹窗里，这里只做备份。</p>

    <section class="card" id="export" aria-labelledby="export-title">
      <h2 id="export-title" data-i18n="backup.export">导出备份</h2>
      <p data-i18n="backup.exportDesc">把设置、预设、网站规则和记住的视频存成一个 JSON 文件。</p>
      <button type="button" class="btn accent" id="btn-export" data-i18n="backup.export">导出备份</button>
      <p class="msg" id="export-msg" role="status"></p>
    </section>

    <section class="card" id="import" aria-labelledby="import-title">
      <h2 id="import-title" data-i18n="backup.import">导入备份</h2>
      <p data-i18n="backup.importDesc">从导出的 JSON 文件恢复。会覆盖当前的设置和视频记忆。</p>
      <label class="btn file">
        <input type="file" id="file" accept="application/json,.json" aria-label="选择备份文件" data-i18n-attr="aria-label:backup.choose">
        <span data-i18n="backup.choose">选择备份文件</span>
      </label>
      <div class="preview" id="preview" hidden>
        <p class="strong" id="preview-summary"></p>
        <p class="muted" id="preview-from"></p>
        <button type="button" class="btn accent" id="btn-confirm" data-i18n="backup.confirm">导入并覆盖</button>
      </div>
      <p class="msg" id="import-msg" role="status"></p>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="lib.js"></script>
  <script src="options.js"></script>
</body>
</html>
