<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="options.title">配置档与备份</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 128 128" aria-hidden="true">
        <rect x="0" y="0" width="128" height="128" rx="14" class="logo-bg"></rect>
        <rect x="21" y="33" width="86" height="62" class="logo-screen"></rect>
        <rect x="16" y="28" width="48" height="72" class="logo-lit"></rect>
        <rect x="58" y="14" width="13" height="100" class="logo-bar"></rect>
      </svg>
      <h1 data-i18n="app.name">RTX HDR 开关</h1>
    </div>
    <a class="top-link" id="diag-link" href="diag.html" data-i18n="diag.link">诊断</a>
  </header>

  <main class="wrap">
    <section class="card" id="profiles" aria-labelledby="pf-title">
      <h2 id="pf-title" data-i18n="profile.title">配置档</h2>
      <ul class="pf-list" id="pf-list" aria-labelledby="pf-title"></ul>
      <div class="actions">
        <button type="button" class="btn" id="pf-export-all" data-i18n="profile.exportAll">导出全部</button>
        <label class="btn file">
          <input type="file" id="pf-file" accept="application/json,.json" aria-label="从文件导入" data-i18n-attr="aria-label:profile.importFile">
          <span data-i18n="profile.importFile">从文件导入</span>
        </label>
      </div>
      <p class="msg" id="pf-msg" role="status"></p>
    </section>

    <section class="card" id="backup" aria-labelledby="backup-title">
      <h2 id="backup-title" data-i18n="backup.title">备份</h2>
      <p class="muted" id="backup-summary"></p>
      <div class="actions">
        <button type="button" class="btn accent" id="btn-export" data-i18n="backup.export">导出备份</button>
        <label class="btn file">
          <input type="file" id="file" accept="application/json,.json" aria-label="导入备份" data-i18n-attr="aria-label:backup.import">
          <span data-i18n="backup.import">导入备份</span>
        </label>
      </div>
      <p class="msg" id="export-msg" role="status"></p>
      <div class="preview" id="preview" hidden>
        <p class="strong" id="preview-summary"></p>
        <p class="muted" id="preview-from"></p>
        <button type="button" class="btn accent" id="btn-confirm" data-i18n="backup.confirm">导入并覆盖</button>
      </div>
      <p class="msg" id="import-msg" role="status"></p>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="lib.js"></script>
  <script src="options.js"></script>
</body>
</html>
